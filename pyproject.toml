[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "regnetwork-mcp"
dynamic = ["version"]
description = "Online-first, read-only research tools for RegNetwork"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "qi-717abc" }]
keywords = ["MCP", "RegNetwork", "bioinformatics", "gene-regulatory-network"]
requires-python = ">=3.13,<3.14"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "mcp[cli]>=2.3,<3",
  "httpx>=0.28,<1",
  "pydantic>=2,<3",
  "networkx>=3,<4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
regnetwork-mcp = "regnetwork_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/regnetwork_mcp"]

[tool.hatch.build.targets.sdist]
only-include = ["src/regnetwork_mcp", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.hatch.version]
path = "src/regnetwork_mcp/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
